name: Prueba
on: workflow_dispatch
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install --quiet yfinance
      - run: python scripts/prueba.py || true
      - run: |
          git config user.name "datos-bot"; git config user.email "datos-bot@users.noreply.github.com"
          git add data/_prueba.txt; git commit -m "prueba" -q; git pull --rebase -q; git push -q
